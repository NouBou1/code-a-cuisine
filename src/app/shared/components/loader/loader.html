<div class="loader" role="status" aria-live="polite">
  <app-menu-bar theme="dark" />
  <div class="content">
    <div class="card">
      <img class="spinner" src="assets/images/loading-spinner.webp" alt="" width="436" height="613" />
    </div>
    <div class="message">
      <p class="text">
        {{ text() }}
        <span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
      </p>
      @if (hint()) {
        <p class="hint">{{ hint() }}</p>
      }
    </div>
  </div>
</div>
